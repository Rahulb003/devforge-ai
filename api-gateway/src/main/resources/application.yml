# api-gateway — the single entry point in front of the platform.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

devforge:
  metrics:
    # Scrape credential for /actuator/prometheus; unset means the endpoint refuses everyone.
    token: ${DEVFORGE_METRICS_TOKEN:}
  auth:
    # Must match auth-service security.jwt.cookie-name: writes carrying it need X-Requested-With.
    refresh-cookie-name: ${DEVFORGE_COOKIE_NAME:DEVFORGE_REFRESH_TOKEN}
  rate-limit:
    # Per client address, per minute, on the unauthenticated auth endpoints.
    auth-per-minute: ${DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE:30}
    # Only behind a proxy that overwrites X-Forwarded-For; otherwise a client picks its own bucket.
    trust-forwarded-for: ${DEVFORGE_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  services:
    # No defaults: a wrong or missing address would silently route traffic
    # nowhere, which is harder to diagnose than a refusal to start.
    auth-service-url: ${AUTH_SERVICE_URL}
    project-service-url: ${PROJECT_SERVICE_URL}
    task-service-url: ${TASK_SERVICE_URL}
    notification-service-url: ${NOTIFICATION_SERVICE_URL}
    git-service-url: ${GIT_SERVICE_URL}
    review-service-url: ${REVIEW_SERVICE_URL}
    documentation-service-url: ${DOCUMENTATION_SERVICE_URL}
    analytics-service-url: ${ANALYTICS_SERVICE_URL}
    chat-service-url: ${CHAT_SERVICE_URL}
  cors:
    # Explicit origins, never a wildcard: the API is credentialed, and a
    # wildcard with credentials is both rejected by browsers and unsafe.
    allowed-origins: ${DEVFORGE_CORS_ORIGINS:http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
