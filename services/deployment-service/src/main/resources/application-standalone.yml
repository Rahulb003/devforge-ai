# deployment-service — STANDALONE profile.
# Real code on an embedded database, so the platform runs without PostgreSQL.
# Never use this anywhere real.
server:
  port: ${SERVER_PORT:9009}

spring:
  application:
    name: deployment-service
  datasource:
    url: jdbc:h2:file:./data/devforge-deployment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # Must match auth-service exactly, or every request looks unauthenticated.
    issuer: devforge-ai
    signing-key: local-development-only-signing-key-change-me-0123456789abcdef

devforge:
  services:
    project-service-url: ${PROJECT_SERVICE_URL:http://localhost:9002}
  sandbox:
    # Still off unless asked for: set DEVFORGE_SANDBOX_ENABLED=true with Docker running.
    enabled: ${DEVFORGE_SANDBOX_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devforge.ai: DEBUG
