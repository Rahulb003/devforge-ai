# deployment-service — base configuration.
# Credentials come from the environment with no fallbacks; see .env.example.
server:
  port: ${SERVER_PORT:9009}

spring:
  application:
    name: deployment-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping against it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # Must match the auth service: this service only verifies the tokens it issues.
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}

devforge:
  metrics:
    # Scrape credential for /actuator/prometheus; unset means the endpoint refuses everyone.
    token: ${DEVFORGE_METRICS_TOKEN:}
  services:
    # Project membership decides who may run code in a project and read its runs.
    project-service-url: ${PROJECT_SERVICE_URL}
    # Pipelines read the repository and its .devforge/pipeline.yml from here, as the caller.
    git-service-url: ${GIT_SERVICE_URL}
  sandbox:
    # Off by default: see SandboxConfig and docs/SANDBOX.md before turning it on.
    enabled: ${DEVFORGE_SANDBOX_ENABLED:false}
    docker-binary: ${DEVFORGE_SANDBOX_DOCKER_BINARY:docker}
    max-timeout-seconds: ${DEVFORGE_SANDBOX_MAX_TIMEOUT_SECONDS:10}
    max-memory-mb: ${DEVFORGE_SANDBOX_MAX_MEMORY_MB:256}
    max-output-bytes: ${DEVFORGE_SANDBOX_MAX_OUTPUT_BYTES:65536}
    runs-per-hour: ${DEVFORGE_SANDBOX_RUNS_PER_HOUR:30}
    concurrent-runs: ${DEVFORGE_SANDBOX_CONCURRENT_RUNS:4}
  pipelines:
    max-step-seconds: ${DEVFORGE_PIPELINE_MAX_STEP_SECONDS:120}
    step-memory-mb: ${DEVFORGE_PIPELINE_STEP_MEMORY_MB:512}
    runs-per-hour: ${DEVFORGE_PIPELINE_RUNS_PER_HOUR:10}
    concurrent-runs: ${DEVFORGE_PIPELINE_CONCURRENT_RUNS:2}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
