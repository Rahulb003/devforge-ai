# Test configuration for deployment-service.
#
# Runs the real Flyway migrations against H2 in PostgreSQL mode, then
# ddl-auto=validate asserts the JPA mappings match the migrated schema.
server:
  port: 0

spring:
  application:
    name: deployment-service
  datasource:
    url: jdbc:h2:mem:deploymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    issuer: devforge-ai-test
    # Test-only key, never used outside the test source set.
    signing-key: test-only-signing-key-that-is-long-enough-to-satisfy-hs256-256-bit-requirement

devforge:
  services:
    # Never reached: ProjectAccessClient is replaced by a mock in the tests.
    project-service-url: http://localhost:19002
    # Never reached: GitContentClient is replaced by a mock in the tests.
    git-service-url: http://localhost:19005
  sandbox:
    # The API tests replace the sandbox; DockerSandboxEscapeTest drives the real one directly.
    enabled: false
    runs-per-hour: 3
  pipelines:
    runs-per-hour: 3
    # Small, so one test can show a file over the cap being left out.
    max-workspace-bytes: 1000

management:
  endpoints:
    web:
      exposure:
        include: health, info
