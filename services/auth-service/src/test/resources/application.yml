# Test configuration for auth-service.
#
# This overrides src/main/resources/application.yml for the whole test source set.
# It runs the REAL Flyway migrations against an in-memory H2 database in PostgreSQL
# compatibility mode, then sets ddl-auto=validate so Hibernate asserts that the JPA
# entity mappings actually match the migrated schema. That catches entity/migration
# drift without requiring a Docker daemon.
#
# Tests that need true PostgreSQL behaviour (or Flyway's postgresql module) should use
# Testcontainers instead; see docs/TESTING.md.
server:
  port: 0

spring:
  application:
    # Stamped into every event envelope as "source". Without it, events are
    # attributed to "unknown-service" and become untraceable.
    name: auth-service
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

security:
  mfa:
    issuer: DevForge AI Test
    totp-window-steps: 1
    backup-code-count: 10
  login:
    # Brute-force protection: failures counted per account over a rolling window.
    # Deliberately not a sticky lock, which would let anyone disable an account.
    max-failed-attempts: ${DEVFORGE_LOGIN_MAX_FAILED:5}
    failure-window: ${DEVFORGE_LOGIN_FAILURE_WINDOW:15m}
  jwt:
    issuer: devforge-ai-test
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    # Test-only key. Never used outside the test source set.
    signing-key: test-only-signing-key-that-is-long-enough-to-satisfy-hs256-256-bit-requirement
    cookie-name: DEVFORGE_REFRESH_TOKEN
    # Tests run over plain HTTP, so the Secure attribute must be off here.
    cookie-secure: false
    cookie-same-site: Lax

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.flywaydb: INFO

devforge:
  kafka:
    # No broker in the test environment.
    enabled: false
  outbox:
    # The recorder still writes rows, which is what the outbox tests assert. The
    # scheduled publisher is off because there is nothing to publish to.
    enabled: false
    # H2 does not support FOR UPDATE SKIP LOCKED.
    use-skip-locked: false
