server:
  port: 9001
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/devforge
    username: devforge
    password: devforge
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: smtp.example.com
    port: 587
    username: no-reply@devforge.ai
    password: changeme
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
security:
  jwt:
    issuer: devforge-ai
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    signing-key: change-this-to-a-very-secure-secret-key-that-is-at-least-256-bits
    cookie-name: DEVFORGE_REFRESH_TOKEN
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
