# auth-service — base configuration.
#
# Every credential is sourced from the environment and, deliberately, has NO
# fallback value. A deployment that forgets to supply one fails fast at startup
# instead of silently booting with a known development secret.
#
# Local development values live in application-local.yml and are only applied
# when SPRING_PROFILES_ACTIVE=local. See .env.example at the repository root.
server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway. Hibernate only verifies that the mapping
      # matches the migrated schema; it must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

security:
  login:
    # Brute-force protection: failures counted per account over a rolling window.
    # Deliberately not a sticky lock, which would let anyone disable an account.
    max-failed-attempts: ${DEVFORGE_LOGIN_MAX_FAILED:5}
    failure-window: ${DEVFORGE_LOGIN_FAILURE_WINDOW:15m}
  jwt:
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    access-token-ttl: ${DEVFORGE_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${DEVFORGE_JWT_REFRESH_TTL:14d}
    # No default: HS256 needs >= 256 bits and JwtConfig rejects a short or
    # missing key at startup.
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}
    cookie-name: ${DEVFORGE_COOKIE_NAME:DEVFORGE_REFRESH_TOKEN}
    cookie-secure: ${DEVFORGE_COOKIE_SECURE:true}
    cookie-same-site: ${DEVFORGE_COOKIE_SAME_SITE:Strict}

devforge:
  app:
    base-url: ${DEVFORGE_APP_BASE_URL:https://app.devforge.ai}
  mail:
    from: ${MAIL_FROM:no-reply@devforge.ai}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Health details can disclose infrastructure topology and credentials
      # status, so they are only shown to authorized callers by default.
      show-details: when-authorized
  info:
    env:
      enabled: false
