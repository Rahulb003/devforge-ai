# auth-service — base configuration.
#
# Every credential is sourced from the environment and, deliberately, has NO
# fallback value. A deployment that forgets to supply one fails fast at startup
# instead of silently booting with a known development secret.
#
# Local development values live in application-local.yml and are only applied
# when SPRING_PROFILES_ACTIVE=local. See .env.example at the repository root.
server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway. Hibernate only verifies that the mapping
      # matches the migrated schema; it must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: auth-service
      # Never auto-commit: the offset must move only after the handler succeeded,
      # or a crash mid-handler silently skips the event.
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

security:
  mfa:
    # Shown in the user's authenticator app.
    issuer: ${DEVFORGE_MFA_ISSUER:DevForge AI}
    # Accepted clock drift in 30s steps; wider means an intercepted code lives longer.
    totp-window-steps: ${DEVFORGE_MFA_TOTP_WINDOW_STEPS:1}
    backup-code-count: ${DEVFORGE_MFA_BACKUP_CODE_COUNT:10}
  login:
    # Brute-force protection: failures counted per account over a rolling window.
    # Deliberately not a sticky lock, which would let anyone disable an account.
    max-failed-attempts: ${DEVFORGE_LOGIN_MAX_FAILED:5}
    failure-window: ${DEVFORGE_LOGIN_FAILURE_WINDOW:15m}
  jwt:
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    access-token-ttl: ${DEVFORGE_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${DEVFORGE_JWT_REFRESH_TTL:14d}
    # No default: HS256 needs >= 256 bits and JwtConfig rejects a short or
    # missing key at startup.
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}
    cookie-name: ${DEVFORGE_COOKIE_NAME:DEVFORGE_REFRESH_TOKEN}
    cookie-secure: ${DEVFORGE_COOKIE_SECURE:true}
    cookie-same-site: ${DEVFORGE_COOKIE_SAME_SITE:Strict}

devforge:
  services:
    # Asked to remove a user's organization memberships before their account is deleted. Unset,
    # account deletion refuses with 503 rather than leave memberships behind.
    project-service-url: ${PROJECT_SERVICE_URL:}
  metrics:
    # Scrape credential for /actuator/prometheus; unset means the endpoint refuses everyone.
    token: ${DEVFORGE_METRICS_TOKEN:}
  auth:
    # On by default. Without it nothing proves the registrant controls the
    # address, and the address is the account-recovery channel.
    require-email-verification: ${DEVFORGE_REQUIRE_EMAIL_VERIFICATION:true}
  kafka:
    enabled: ${DEVFORGE_KAFKA_ENABLED:true}
  outbox:
    enabled: ${DEVFORGE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${DEVFORGE_OUTBOX_POLL_MS:1000}
    batch-size: ${DEVFORGE_OUTBOX_BATCH_SIZE:100}
    # FOR UPDATE SKIP LOCKED. Required when more than one instance runs, or every
    # replica publishes the same rows and duplicates each event.
    use-skip-locked: ${DEVFORGE_OUTBOX_SKIP_LOCKED:true}
  app:
    base-url: ${DEVFORGE_APP_BASE_URL:https://app.devforge.ai}
  mail:
    # log | smtp. Selected by configuration rather than by profile, so any
    # environment can send real mail once MAIL_* is populated.
    provider: ${DEVFORGE_MAIL_PROVIDER:smtp}
    # Serves captured mail, including single-use tokens. Never enable outside
    # local development.
    dev-mailbox-enabled: ${DEVFORGE_DEV_MAILBOX_ENABLED:false}
    from: ${MAIL_FROM:no-reply@devforge.ai}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # Health details can disclose infrastructure topology and credentials
      # status, so they are only shown to authorized callers by default.
      show-details: when-authorized
  info:
    env:
      enabled: false
