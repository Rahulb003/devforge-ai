# git-service — base configuration.
# Credentials come from the environment with no fallbacks; see .env.example.
server:
  port: ${SERVER_PORT:9005}

spring:
  application:
    name: git-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping against it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: git-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      # Repository content arrives as JSON today, not as uploads. Kept small so an
      # unexpected multipart request cannot buffer something large.
      max-file-size: 2MB
      max-request-size: 2MB

security:
  jwt:
    # Must match the auth service: this service only verifies the tokens it issues.
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}

devforge:
  metrics:
    # Scrape credential for /actuator/prometheus; unset means the endpoint refuses everyone.
    token: ${DEVFORGE_METRICS_TOKEN:}
  services:
    # Project membership is the authority for repository access, and it lives here.
    # No default: a wrong address would silently fail every request closed.
    project-service-url: ${PROJECT_SERVICE_URL}
    # Exchanges a git client's personal access token; see GitHttpConfig.
    auth-service-url: ${AUTH_SERVICE_URL}
  git:
    # Where repository objects live. No default in this profile: writing git data
    # to an unintended directory is not a failure that should be convenient.
    storage-root: ${DEVFORGE_GIT_STORAGE_ROOT}
    # A blob larger than this is returned truncated rather than loaded whole into
    # memory. A repository can legitimately contain a 200MB file.
    max-blob-bytes: ${DEVFORGE_GIT_MAX_BLOB_BYTES:1048576}
    # Limits on one push over HTTP, so a client cannot fill the repository volume in one request.
    max-push-bytes: ${DEVFORGE_GIT_MAX_PUSH_BYTES:104857600}
    max-object-bytes: ${DEVFORGE_GIT_MAX_OBJECT_BYTES:52428800}
  kafka:
    enabled: ${DEVFORGE_KAFKA_ENABLED:true}
  outbox:
    enabled: ${DEVFORGE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${DEVFORGE_OUTBOX_POLL_MS:1000}
    batch-size: ${DEVFORGE_OUTBOX_BATCH_SIZE:100}
    use-skip-locked: ${DEVFORGE_OUTBOX_SKIP_LOCKED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
