# Test configuration for git-service.
#
# Runs the real Flyway migrations against H2 in PostgreSQL mode, then
# ddl-auto=validate asserts the JPA mappings match the migrated schema.
server:
  port: 0

spring:
  application:
    name: git-service
  datasource:
    url: jdbc:h2:mem:gitdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092

security:
  jwt:
    issuer: devforge-ai-test
    # Test-only key, never used outside the test source set.
    signing-key: test-only-signing-key-that-is-long-enough-to-satisfy-hs256-256-bit-requirement

devforge:
  services:
    # Never reached: ProjectAccessClient is replaced by a mock in the tests, so
    # they exercise git logic rather than the network between two services.
    project-service-url: http://localhost:19002
  git:
    # Overridden per test class to a JUnit temporary directory, so a test run
    # never writes git objects into the project tree.
    storage-root: ./target/test-git-storage
    # Small on purpose, so the truncation path is cheap to exercise.
    max-blob-bytes: 2048
  kafka:
    enabled: false
  outbox:
    # The recorder still writes rows, which the event assertions check. The
    # scheduled publisher is off because there is no broker.
    enabled: false
    use-skip-locked: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
