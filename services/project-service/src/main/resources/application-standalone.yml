# project-service — STANDALONE profile.
#
# Same purpose and same warnings as auth-service's standalone profile: real code
# and real persistence on an embedded database, so the platform can be run and
# inspected without external infrastructure. Never use this anywhere real.
#
# Run:  java -jar app.jar --spring.profiles.active=standalone
server:
  port: ${SERVER_PORT:9002}

spring:
  application:
    name: project-service
  datasource:
    # A separate database file from auth-service: these are separate services and
    # must not share a schema. Cross-service reads go over APIs and events.
    url: jdbc:h2:file:./data/devforge-projects;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # MUST match auth-service exactly: this service only verifies tokens, and a
    # mismatch makes every request look unauthenticated.
    issuer: devforge-ai
    signing-key: local-development-only-signing-key-change-me-0123456789abcdef

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devforge.ai: DEBUG

devforge:
  kafka:
    # No broker. The outbox still records events, so publishing is inspectable
    # in the OUTBOX_EVENTS table.
    enabled: false
  outbox:
    enabled: false
    use-skip-locked: false
