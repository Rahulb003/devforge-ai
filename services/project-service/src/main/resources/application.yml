# project-service — base configuration.
# Credentials come from the environment with no fallbacks; see .env.example.
server:
  port: ${SERVER_PORT:9002}

spring:
  application:
    name: project-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping against it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    # Must match the auth service: this service verifies the tokens that one issues.
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized

devforge:
  metrics:
    # Scrape credential for /actuator/prometheus; unset means the endpoint refuses everyone.
    token: ${DEVFORGE_METRICS_TOKEN:}
  kafka:
    enabled: ${DEVFORGE_KAFKA_ENABLED:true}
  outbox:
    enabled: ${DEVFORGE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${DEVFORGE_OUTBOX_POLL_MS:1000}
    batch-size: ${DEVFORGE_OUTBOX_BATCH_SIZE:100}
    use-skip-locked: ${DEVFORGE_OUTBOX_SKIP_LOCKED:true}
