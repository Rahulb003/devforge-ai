# Test configuration for project-service.
#
# Runs the real Flyway migrations against H2 in PostgreSQL mode, then
# ddl-auto=validate asserts the JPA mappings match the migrated schema.
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:projectdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    issuer: devforge-ai-test
    # Test-only key, never used outside the test source set.
    signing-key: test-only-signing-key-that-is-long-enough-to-satisfy-hs256-256-bit-requirement

management:
  endpoints:
    web:
      exposure:
        include: health, info
