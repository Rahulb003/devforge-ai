# documentation-service — base configuration.
# Credentials come from the environment with no fallbacks; see .env.example.
server:
  port: ${SERVER_PORT:9007}

spring:
  application:
    name: documentation-service
  datasource:
    url: ${DEVFORGE_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping against it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: documentation-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      # Repository content arrives as JSON today, not as uploads. Kept small so an
      # unexpected multipart request cannot buffer something large.
      max-file-size: 2MB
      max-request-size: 2MB

security:
  jwt:
    # Must match the auth service: this service only verifies the tokens it issues.
    issuer: ${DEVFORGE_JWT_ISSUER:devforge-ai}
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY}

devforge:
  services:
    # Project membership is the authority for repository access, and it lives here.
    # No default: a wrong address would silently fail every request closed.
    project-service-url: ${PROJECT_SERVICE_URL}
    # Repository content is read from git-service, which owns the object
    # database. No default: a wrong address would make every generation fail.
    git-service-url: ${GIT_SERVICE_URL}
  git-content:
    # Bounds on what one fetch will pull from git-service. A repository is
    # untrusted input, so every walk and read is capped rather than trusted.
    max-files: ${DEVFORGE_GIT_CONTENT_MAX_FILES:400}
    max-directories: ${DEVFORGE_GIT_CONTENT_MAX_DIRECTORIES:200}
    max-file-bytes: ${DEVFORGE_GIT_CONTENT_MAX_FILE_BYTES:262144}
  kafka:
    enabled: ${DEVFORGE_KAFKA_ENABLED:true}
  outbox:
    enabled: ${DEVFORGE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${DEVFORGE_OUTBOX_POLL_MS:1000}
    batch-size: ${DEVFORGE_OUTBOX_BATCH_SIZE:100}
    use-skip-locked: ${DEVFORGE_OUTBOX_SKIP_LOCKED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
