# notification-service — STANDALONE profile.
# Real code and real persistence on an embedded database, so the platform can be
# run without PostgreSQL or Kafka. Never use this anywhere real.
server:
  port: ${SERVER_PORT:9011}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:file:./data/devforge-notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # Must match auth-service exactly, or every request looks unauthenticated.
    issuer: devforge-ai
    signing-key: local-development-only-signing-key-change-me-0123456789abcdef

devforge:
  kafka:
    # No broker in this profile, so the listener is not registered and nothing
    # arrives. The read API still works against whatever is already stored, but
    # the feed will stay empty — this is a limitation of running without Kafka,
    # not of the service.
    enabled: false
  outbox:
    enabled: false
    use-skip-locked: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devforge.ai: DEBUG
