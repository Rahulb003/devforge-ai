# analytics-service — LOCAL DEVELOPMENT ONLY.
spring:
  datasource:
    url: ${DEVFORGE_DB_URL:jdbc:postgresql://localhost:5432/devforge}
    username: ${POSTGRES_USER:devforge}
    password: ${POSTGRES_PASSWORD:devforge}
  analytics:
    # Longest window one request may ask for, so a single query cannot pull years of rows.
    max-range-days: ${DEVFORGE_ANALYTICS_MAX_RANGE_DAYS:366}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

security:
  jwt:
    signing-key: ${DEVFORGE_JWT_SIGNING_KEY:local-development-only-signing-key-change-me-0123456789abcdef}

devforge:
  services:
    project-service-url: ${PROJECT_SERVICE_URL:http://localhost:9002}

logging:
  level:
    com.devforge.ai: DEBUG
