# Test configuration for analytics-service.
#
# Runs the real Flyway migrations against H2 in PostgreSQL mode, then
# ddl-auto=validate asserts the JPA mappings match the migrated schema.
server:
  port: 0

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:h2:mem:analyticsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  analytics:
    # Longest window one request may ask for, so a single query cannot pull years of rows.
    max-range-days: ${DEVFORGE_ANALYTICS_MAX_RANGE_DAYS:366}
  kafka:
    # Overridden to the embedded broker by the tests that need one.
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service
      enable-auto-commit: false
      # Must mirror the main profile. Left at the default of 'latest', a consumer that
      # has not finished joining the group when a test publishes never sees the message,
      # which looks exactly like a counting bug.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    issuer: devforge-ai-test
    # Test-only key, never used outside the test source set.
    signing-key: test-only-signing-key-that-is-long-enough-to-satisfy-hs256-256-bit-requirement

devforge:
  services:
    # Never reached: ProjectAccessClient is replaced by a mock in the tests, so
    # they exercise review logic rather than the network between two services.
    project-service-url: http://localhost:19002
    # Never reached: GitContentClient is replaced by a mock in the tests, so
    # they exercise analysis rather than the network between two services.
  kafka:
    enabled: false
  outbox:
    # The recorder still writes rows, which the event assertions check. The
    # scheduled publisher is off because there is no broker.
    enabled: false
    use-skip-locked: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
