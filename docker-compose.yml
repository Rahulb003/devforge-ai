services:
  frontend:
    build:
      context: ./frontend
    ports:
      - 80:80
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - 8080:8080
    depends_on:
      - discovery-server
      - config-server

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - 8888:8888

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - 8761:8761

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - 9001:9001
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      # Hosts are compose service names; the local profile's defaults point at
      # localhost, which inside a container resolves to the container itself.
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devforge}
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_AUTH_ENABLED: ${MAIL_AUTH_ENABLED:-false}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
      DEVFORGE_APP_BASE_URL: ${DEVFORGE_APP_BASE_URL:-http://localhost:4173}
      # Falls back to the local development key. Override in .env for anything
      # that is not a throwaway local stack.
      DEVFORGE_JWT_SIGNING_KEY: ${DEVFORGE_JWT_SIGNING_KEY:-local-development-only-signing-key-change-me-0123456789abcdef}
      DEVFORGE_COOKIE_SECURE: ${DEVFORGE_COOKIE_SECURE:-false}
      DEVFORGE_COOKIE_SAME_SITE: ${DEVFORGE_COOKIE_SAME_SITE:-Lax}
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq
      - mailpit

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    ports:
      - 9002:9002
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    ports:
      - 9003:9003
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - 9004:9004
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  git-service:
    build:
      context: .
      dockerfile: services/git-service/Dockerfile
    ports:
      - 9005:9005
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - 9006:9006
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    ports:
      - 9007:9007
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  deployment-service:
    build:
      context: .
      dockerfile: services/deployment-service/Dockerfile
    ports:
      - 9008:9008
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  documentation-service:
    build:
      context: .
      dockerfile: services/documentation-service/Dockerfile
    ports:
      - 9009:9009
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - 9010:9010
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    ports:
      - 9011:9011
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge}
      POSTGRES_DB: ${POSTGRES_DB:-devforge}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
    ports:
      - 5672:5672
      - 15672:15672

  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

  # Captures outbound mail locally instead of delivering it.
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 8025:8025
      - 1025:1025

volumes:
  postgres-data:
