# DevForge AI — the whole platform against real PostgreSQL, Kafka and Redis.
#
#   docker compose up -d --build              # the platform: http://localhost:4173
#   docker compose --profile observability up # also Kafka UI, Prometheus, Alertmanager, Grafana
#   docker compose --profile scaffold up      # also the not-yet-built services
#
# CI starts this file and runs the browser suite against it, so it is exercised, not decorative.
# The first CI attempt found that six services had no database or broker settings, the gateway had
# no routes, the frontend could not reach the API, and every service shared one database.

# Settings every Java service takes. Hosts are compose service names: inside a container,
# "localhost" is the container itself.
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  POSTGRES_USER: ${POSTGRES_USER:-devforge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # Every Kafka client authenticates as its own service, over TLS; a missing credential stops it at
  # startup. The broker's certificate is signed by this stack's own CA (kafka-certs), so clients
  # trust that CA's certificate and verify the broker's name against it.
  DEVFORGE_KAFKA_REQUIRE_AUTHENTICATION: "true"
  DEVFORGE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  DEVFORGE_KAFKA_SASL_MECHANISM: PLAIN
  DEVFORGE_KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
  # Falls back to the local development key. Override in .env for anything that is not a
  # throwaway local stack.
  DEVFORGE_JWT_SIGNING_KEY: ${DEVFORGE_JWT_SIGNING_KEY:-local-development-only-signing-key-change-me-0123456789abcdef}
  DEVFORGE_JWT_ISSUER: ${DEVFORGE_JWT_ISSUER:-devforge-ai}
  PROJECT_SERVICE_URL: http://project-service:9002
  # git-service exchanges a git client's personal access token here.
  AUTH_SERVICE_URL: http://auth-service:9001
  # Scrape credential for /actuator/prometheus; must match infrastructure/monitoring/prometheus.yml.
  DEVFORGE_METRICS_TOKEN: ${DEVFORGE_METRICS_TOKEN:-metrics-dev-only}
  GIT_SERVICE_URL: http://git-service:9005

# Every service waits for the database and broker to be ready, not merely started.
x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  kafka-setup:
    condition: service_completed_successfully

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      # The container listens on 8080: the image runs as a non-root user and
      # cannot bind a privileged port.
      - ${FRONTEND_PORT:-4173}:8080
    environment:
      # nginx proxies /api here, keeping the browser on one origin for the session cookies.
      API_GATEWAY_UPSTREAM: http://api-gateway:8080
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: api-gateway
        ARTIFACT_ID: api-gateway
        SERVICE_PORT: "8080"
    ports:
      - 8080:8080
    environment:
      AUTH_SERVICE_URL: http://auth-service:9001
      PROJECT_SERVICE_URL: http://project-service:9002
      TASK_SERVICE_URL: http://task-service:9003
      GIT_SERVICE_URL: http://git-service:9005
      REVIEW_SERVICE_URL: http://review-service:9006
      DOCUMENTATION_SERVICE_URL: http://documentation-service:9007
      CHAT_SERVICE_URL: http://chat-service:9008
      ANALYTICS_SERVICE_URL: http://analytics-service:9010
      NOTIFICATION_SERVICE_URL: http://notification-service:9011
      DEVFORGE_CORS_ORIGINS: ${DEVFORGE_CORS_ORIGINS:-http://localhost:4173}
      DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE: ${DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE:-30}
      DEVFORGE_METRICS_TOKEN: ${DEVFORGE_METRICS_TOKEN:-metrics-dev-only}

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/auth-service
        ARTIFACT_ID: auth-service
        SERVICE_PORT: "9001"
    ports:
      - 9001:9001
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_auth
      DEVFORGE_KAFKA_SASL_USERNAME: auth-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_AUTH:-auth-dev-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_AUTH_ENABLED: ${MAIL_AUTH_ENABLED:-false}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
      DEVFORGE_APP_BASE_URL: ${DEVFORGE_APP_BASE_URL:-http://localhost:4173}
      DEVFORGE_COOKIE_SECURE: ${DEVFORGE_COOKIE_SECURE:-false}
      DEVFORGE_COOKIE_SAME_SITE: ${DEVFORGE_COOKIE_SAME_SITE:-Lax}
      # Verification mail lands in Mailpit (http://localhost:8025). CI turns it off, since the
      # browser suite signs straight in after signing up.
      DEVFORGE_REQUIRE_EMAIL_VERIFICATION: ${DEVFORGE_REQUIRE_EMAIL_VERIFICATION:-true}
    volumes:
      - kafka-certs:/certs:ro
    depends_on:
      <<: *service-depends
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  project-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/project-service
        ARTIFACT_ID: project-service
        SERVICE_PORT: "9002"
    ports:
      - 9002:9002
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_project
      DEVFORGE_KAFKA_SASL_USERNAME: project-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_PROJECT:-project-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  task-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/task-service
        ARTIFACT_ID: task-service
        SERVICE_PORT: "9003"
    ports:
      - 9003:9003
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_task
      DEVFORGE_KAFKA_SASL_USERNAME: task-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_TASK:-task-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  git-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/git-service
        ARTIFACT_ID: git-service
        SERVICE_PORT: "9005"
    ports:
      - 9005:9005
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_git
      DEVFORGE_KAFKA_SASL_USERNAME: git-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_GIT:-git-dev-only}
      DEVFORGE_GIT_STORAGE_ROOT: /app/data/git-repositories
    volumes:
      - kafka-certs:/certs:ro
      - git-repositories:/app/data/git-repositories
    depends_on: *service-depends

  review-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/review-service
        ARTIFACT_ID: review-service
        SERVICE_PORT: "9006"
    ports:
      - 9006:9006
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_review
      DEVFORGE_KAFKA_SASL_USERNAME: review-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_REVIEW:-review-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  documentation-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/documentation-service
        ARTIFACT_ID: documentation-service
        SERVICE_PORT: "9007"
    ports:
      - 9007:9007
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_documentation
      DEVFORGE_KAFKA_SASL_USERNAME: documentation-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_DOCUMENTATION:-documentation-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/chat-service
        ARTIFACT_ID: chat-service
        SERVICE_PORT: "9008"
    ports:
      - 9008:9008
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_chat
      DEVFORGE_KAFKA_SASL_USERNAME: chat-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_CHAT:-chat-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/analytics-service
        ARTIFACT_ID: analytics-service
        SERVICE_PORT: "9010"
    ports:
      - 9010:9010
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_analytics
      DEVFORGE_KAFKA_SASL_USERNAME: analytics-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_ANALYTICS:-analytics-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/notification-service
        ARTIFACT_ID: notification-service
        SERVICE_PORT: "9011"
    ports:
      - 9011:9011
    environment:
      <<: *service-env
      DEVFORGE_DB_URL: jdbc:postgresql://postgres:5432/devforge_notification
      DEVFORGE_KAFKA_SASL_USERNAME: notification-service
      DEVFORGE_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_NOTIFICATION:-notification-dev-only}
    volumes:
      - kafka-certs:/certs:ro
    depends_on: *service-depends

  # --- Not built yet: scaffolds only, opt-in -------------------------------
  # ai-service needs model credentials and deployment-service a sandbox (docs/SANDBOX.md).
  
  ai-service:
    profiles: [scaffold]
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/ai-service
        ARTIFACT_ID: ai-service
        SERVICE_PORT: "9004"
    ports:
      - 9004:9004
    environment:
      <<: *service-env
    volumes:
      - kafka-certs:/certs:ro

  deployment-service:
    profiles: [scaffold]
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        MODULE_PATH: services/deployment-service
        ARTIFACT_ID: deployment-service
        SERVICE_PORT: "9009"
    ports:
      - 9009:9009
    environment:
      <<: *service-env

  # --- Infrastructure --------------------------------------------------------
    volumes:
      - kafka-certs:/certs:ro

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge}
      POSTGRES_DB: ${POSTGRES_DB:-devforge}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # One database per service, created on first start.
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devforge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - 6379:6379

  # Kafka in KRaft mode: no ZooKeeper, which removes a whole component from the
  # local stack and from operations.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The controller listener is bound to the container's loopback: it is unauthenticated, and
      # its ANONYMOUS principal must be a super user for the controller to work, so nothing outside
      # this container may reach it.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://localhost:29093,EXTERNAL://0.0.0.0:9092
      # Services inside the network reach kafka:29092; the host uses localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL
      # TLS on both client listeners, with the certificate kafka-certs generated. Set as plain
      # properties: the image's own SSL handling looks for "SSL://" in the listener names, which
      # these avoid, and would otherwise demand its credential-file layout.
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/broker.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:-tls-dev-only}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:-tls-dev-only}
      # The broker connects to itself over INTERNAL, so it verifies its own certificate too.
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # One identity per service. Their grants are in infrastructure/docker/kafka/setup.sh.
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:-admin-dev-only}" user_admin="${KAFKA_ADMIN_PASSWORD:-admin-dev-only}" user_auth-service="${KAFKA_PASSWORD_AUTH:-auth-dev-only}" user_project-service="${KAFKA_PASSWORD_PROJECT:-project-dev-only}" user_task-service="${KAFKA_PASSWORD_TASK:-task-dev-only}" user_git-service="${KAFKA_PASSWORD_GIT:-git-dev-only}" user_review-service="${KAFKA_PASSWORD_REVIEW:-review-dev-only}" user_documentation-service="${KAFKA_PASSWORD_DOCUMENTATION:-documentation-dev-only}" user_chat-service="${KAFKA_PASSWORD_CHAT:-chat-dev-only}" user_analytics-service="${KAFKA_PASSWORD_ANALYTICS:-analytics-dev-only}" user_notification-service="${KAFKA_PASSWORD_NOTIFICATION:-notification-dev-only}";'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:-admin-dev-only}" user_admin="${KAFKA_ADMIN_PASSWORD:-admin-dev-only}" user_auth-service="${KAFKA_PASSWORD_AUTH:-auth-dev-only}" user_project-service="${KAFKA_PASSWORD_PROJECT:-project-dev-only}" user_task-service="${KAFKA_PASSWORD_TASK:-task-dev-only}" user_git-service="${KAFKA_PASSWORD_GIT:-git-dev-only}" user_review-service="${KAFKA_PASSWORD_REVIEW:-review-dev-only}" user_documentation-service="${KAFKA_PASSWORD_DOCUMENTATION:-documentation-dev-only}" user_chat-service="${KAFKA_PASSWORD_CHAT:-chat-dev-only}" user_analytics-service="${KAFKA_PASSWORD_ANALYTICS:-analytics-dev-only}" user_notification-service="${KAFKA_PASSWORD_NOTIFICATION:-notification-dev-only}";'
      # Deny by default: a principal with no ACL can do nothing.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
      # Not KAFKA_-prefixed, or the image would write it into server.properties.
      HEALTHCHECK_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-admin-dev-only}
      # Single broker locally, so replication cannot exceed 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by kafka-setup; a typo in a topic name must fail, not create a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: devforge-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-certs:/certs:ro
    depends_on:
      kafka-certs:
        condition: service_completed_successfully
    healthcheck:
      # Authenticates as admin, since the client listeners now require it. Listener names avoid
      # "SASL_": the Confluent image then demands a JAAS file instead of the per-listener settings.
      test:
        - CMD-SHELL
        - >-
          printf '%s\n' security.protocol=SASL_SSL sasl.mechanism=PLAIN
          ssl.truststore.type=PEM ssl.truststore.location=/certs/ca.pem
          "sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"$${HEALTHCHECK_ADMIN_PASSWORD}\";"
          > /tmp/hc.properties &&
          kafka-broker-api-versions --bootstrap-server localhost:9092 --command-config /tmp/hc.properties
      interval: 10s
      timeout: 10s
      retries: 15

  # Generates this stack's CA and the broker's certificate on first start, then exits.
  kafka-certs:
    image: confluentinc/cp-kafka:7.7.1
    # Root, to write into the new volume and hand the keystore to the broker's user.
    user: "0"
    entrypoint: ["sh", "/setup/certs.sh"]
    environment:
      KAFKA_TLS_STORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD:-tls-dev-only}
    volumes:
      - ./infrastructure/docker/kafka:/setup:ro
      - kafka-certs:/certs

  # Creates the topics and the per-service ACLs, then exits. Services start after it succeeds.
  kafka-setup:
    image: confluentinc/cp-kafka:7.7.1
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-admin-dev-only}
    volumes:
      - ./infrastructure/docker/kafka:/setup:ro
      - kafka-certs:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy

  # Captures outbound mail locally instead of delivering it.
  # Web UI: http://localhost:8025
  mailpit:
    # From GitHub's registry, pinned: Docker Hub rate-limits anonymous pulls per address, and CI
    # runners share addresses.
    image: ghcr.io/axllent/mailpit:v1.31.4
    ports:
      - 8025:8025
      - 1025:1025

  # --- Observability: opt-in ---------------------------------------------------

  # Web UI for inspecting topics, consumer lag and dead-letter contents.
  kafka-ui:
    profiles: [observability]
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: devforge-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:-admin-dev-only}";'
      DYNAMIC_CONFIG_ENABLED: "true"
    volumes:
      - kafka-certs:/certs:ro
    depends_on:
      - kafka

  prometheus:
    profiles: [observability]
    # Pinned: "latest" would make what CI verifies depend on the day it ran.
    image: quay.io/prometheus/prometheus:v3.15.0
    ports:
      - 9090:9090
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    profiles: [observability]
    image: quay.io/prometheus/alertmanager:v0.34.1
    ports:
      - 9093:9093
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - mailpit

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    # The Prometheus data source and the services dashboard, provisioned rather than clicked in.
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  kafka-data:
  kafka-certs:
  git-repositories:
