name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded runs on the same ref to keep queue times sane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci requires the lockfile to be committed and in sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # "npm test" is vitest in run (non-watch) mode, so it terminates in CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # "verify" runs unit tests (surefire) and integration tests (failsafe).
      # Tests are deliberately NOT skipped here: a green pipeline that skipped
      # the tests tells us nothing.
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every backend Dockerfile runs `mvn -f backend/pom.xml -pl <module> -am`,
      # which needs the WHOLE repository as build context (the reactor parent and
      # common-library live outside each service directory). So the context is the
      # repo root and the Dockerfile is selected with -f, rather than using the
      # service directory as context.
      - name: Build backend images
        run: |
          set -euo pipefail
          modules=(
            "api-gateway:api-gateway"
            "config-server:config-server"
            "discovery-server:discovery-server"
            "auth-service:services/auth-service"
            "project-service:services/project-service"
            "task-service:services/task-service"
            "ai-service:services/ai-service"
            "git-service:services/git-service"
            "review-service:services/review-service"
            "documentation-service:services/documentation-service"
            "chat-service:services/chat-service"
            "deployment-service:services/deployment-service"
            "analytics-service:services/analytics-service"
            "notification-service:services/notification-service"
          )
          for entry in "${modules[@]}"; do
            name="${entry%%:*}"
            path="${entry##*:}"
            echo "::group::Building $name from $path/Dockerfile"
            docker build -f "$path/Dockerfile" -t "devforge-ai/$name:${GITHUB_SHA}" .
            echo "::endgroup::"
          done

      # The frontend image is self-contained, so its context is frontend/.
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "devforge-ai/frontend:${GITHUB_SHA}" frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devforge-ai/auth-service:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Filesystem scan covers both the npm lockfile and the Maven dependency tree,
      # plus hard-coded secrets. exit-code is 0 for now so the scan reports without
      # blocking; tighten to 1 once the current findings are triaged.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
