name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded runs on the same ref to keep queue times sane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci requires the lockfile to be committed and in sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Blocks on any high or critical advisory, build tooling included: a compromised build tool
      # writes the bundle every user runs. Zero today, after the Vite 8 / Tailwind 4 upgrades.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # "npm test" is vitest in run (non-watch) mode, so it terminates in CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # "verify" runs unit tests (surefire) and integration tests (failsafe).
      # Tests are deliberately NOT skipped here: a green pipeline that skipped
      # the tests tells us nothing.
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Every screen goes through the gateway, so the suite needs all of it. This job used to start
      # only auth and project, from before the gateway and the later services existed.
      - name: Build service jars
        run: >
          mvn -B -ntp -f backend/pom.xml
          -pl ../api-gateway,../services/auth-service,../services/project-service,../services/task-service,../services/git-service,../services/review-service,../services/documentation-service,../services/analytics-service,../services/chat-service,../services/notification-service
          -am package -DskipTests

      # The standalone profile runs the real application code against an
      # embedded database, so this job needs no Postgres, Kafka, Redis or SMTP
      # service container.
      - name: Start backend services
        run: |
          mkdir -p logs
          for m in auth-service project-service task-service git-service review-service documentation-service analytics-service chat-service notification-service; do
            java -jar "services/$m/target/$m-0.1.0.jar" \
              --spring.profiles.active=standalone > "logs/$m.log" 2>&1 &
          done
          java -jar api-gateway/target/api-gateway-0.1.0.jar \
            --spring.profiles.active=standalone > logs/api-gateway.log 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The production build under the production headers (vite.config.ts reads them from the file
      # nginx includes), so a Content-Security-Policy that breaks the app fails here. The suite
      # fails any test in which the browser reports a CSP violation.
      - name: Build and serve the production bundle
        working-directory: frontend
        run: |
          npm run build
          npx vite preview > vite.log 2>&1 &

      # Poll rather than sleep: JVM startup time varies a lot on shared runners.
      - name: Wait for the stack
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1"
            for _ in $(seq 1 60); do
              if curl -sS -o /dev/null "$url"; then
                echo "ready: $url"
                return 0
              fi
              sleep 2
            done
            echo "::error::timed out waiting for $url"
            return 1
          }
          for port in 9001 9002 9003 9005 9006 9007 9008 9010 9011 8080; do
            wait_for "http://localhost:$port/actuator/health"
          done
          wait_for http://localhost:4173/

      # Browser-level tests. The unit suite cannot replace these: it once
      # rendered App inside a provider tree the real entry point did not have,
      # so it stayed green while every screen after sign-in threw on mount.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            logs/
            frontend/vite.log
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Base images through Google's mirror of Docker Hub. Anonymous Docker Hub pulls are
        # rate-limited per address, runners share addresses, and a run once failed with 429 before
        # building anything. The images are the same; only where they are fetched from changes.
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # All JVM services share one root Dockerfile and one Maven build. The
      # context is the repository root because the reactor parent and
      # common-library live outside each service directory. The `build` stage is
      # produced once and reused from cache by every subsequent service image.
      - name: Warm the shared build stage
        run: docker build --target build -t devforge-ai/build-cache .

      - name: Build backend images
        run: |
          set -euo pipefail
          # name : module path : port
          modules=(
            "api-gateway:api-gateway:8080"
            "auth-service:services/auth-service:9001"
            "project-service:services/project-service:9002"
            "task-service:services/task-service:9003"
            "ai-service:services/ai-service:9004"
            "git-service:services/git-service:9005"
            "review-service:services/review-service:9006"
            "documentation-service:services/documentation-service:9007"
            "chat-service:services/chat-service:9008"
            "deployment-service:services/deployment-service:9009"
            "analytics-service:services/analytics-service:9010"
            "notification-service:services/notification-service:9011"
          )
          for entry in "${modules[@]}"; do
            name="${entry%%:*}"
            rest="${entry#*:}"
            path="${rest%%:*}"
            port="${rest##*:}"
            echo "::group::Building $name"
            docker build --target service \
              --build-arg "MODULE_PATH=$path" \
              --build-arg "ARTIFACT_ID=$name" \
              --build-arg "SERVICE_PORT=$port" \
              -t "devforge-ai/$name:${GITHUB_SHA}" .
            echo "::endgroup::"
          done

      # The frontend image is self-contained, so its context is frontend/.
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "devforge-ai/frontend:${GITHUB_SHA}" frontend

      # The real nginx image, started, because its header configuration is easy to get wrong in a
      # way only a running server shows: nginx drops inherited add_header directives in any location
      # that sets its own. By that documented rule the previous config sent no CSP on index.html;
      # the image had never been run, so nothing showed it.
      - name: Verify the frontend image sends its security headers
        run: |
          set -euo pipefail
          # nginx resolves the upstream at start; no gateway runs in this check, so point it anywhere.
          docker run -d --name web -p 8088:8080 -e API_GATEWAY_UPSTREAM=http://127.0.0.1:9 \
            "devforge-ai/frontend:${GITHUB_SHA}"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8088/ && break; sleep 1; done
          asset="$(curl -s http://localhost:8088/ | grep -o '/assets/[^"]*\.js' | head -1)"
          for path in / /index.html /some/client/route "$asset"; do
            headers="$(curl -sI "http://localhost:8088$path")"
            for name in content-security-policy x-frame-options x-content-type-options; do
              if ! grep -qi "^$name:" <<<"$headers"; then
                echo "::error::$path is missing $name"
                echo "$headers"
                exit 1
              fi
            done
            echo "ok: $path"
          done
          # The style nonce must be fresh per response and match between header and document;
          # sub_filter is the only thing that puts it in the page.
          response="$(curl -s -D - http://localhost:8088/some/client/route)"
          header_nonce="$(grep -io "nonce-[a-f0-9]*" <<<"$response" | head -1 | cut -c7-)"
          page_nonce="$(grep -o 'name="csp-nonce" content="[^"]*"' <<<"$response" | sed 's/.*content="//; s/"$//')"
          second="$(curl -sI http://localhost:8088/ | grep -io "nonce-[a-f0-9]*" | cut -c7-)"
          echo "header=$header_nonce page=$page_nonce next=$second"
          [ -n "$header_nonce" ] && [ "$header_nonce" = "$page_nonce" ] && [ "$second" != "$header_nonce" ] \
            || { echo "::error::CSP nonce missing, mismatched, or reused"; exit 1; }
          docker rm -f web

      # Start every built service image and wait for it to report healthy. Building an image proves
      # little: a missing Main-Class, a wrong jar path or a startup failure only shows when it runs.
      # The standalone profile needs no database or broker, so each runs alone.
      - name: Verify service images start and report healthy
        run: |
          set -euo pipefail
          services=(
            "auth-service:9001" "project-service:9002" "task-service:9003" "git-service:9005"
            "review-service:9006" "documentation-service:9007" "chat-service:9008"
            "analytics-service:9010" "notification-service:9011" "api-gateway:8080"
          )
          for entry in "${services[@]}"; do
            name="${entry%%:*}"; port="${entry##*:}"
            docker run -d --name "$name" -p "$port:$port" \
              -e SPRING_PROFILES_ACTIVE=standalone "devforge-ai/$name:${GITHUB_SHA}" > /dev/null
          done
          failed=0
          for entry in "${services[@]}"; do
            name="${entry%%:*}"; port="${entry##*:}"
            ok=0
            for _ in $(seq 1 90); do
              if curl -sf -o /dev/null "http://localhost:$port/actuator/health"; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" = 1 ]; then
              echo "healthy: $name"
            else
              echo "::error::$name did not become healthy"
              docker logs "$name" 2>&1 | tail -40
              failed=1
            fi
          done
          docker rm -f "${services[@]%%:*}" > /dev/null
          exit "$failed"

      # Fails the job if any image would run as root. The previous images all
      # did; this keeps that from silently regressing.
      - name: Verify images do not run as root
        run: |
          set -euo pipefail
          for image in auth-service api-gateway frontend; do
            user="$(docker image inspect -f '{{.Config.User}}' "devforge-ai/$image:${GITHUB_SHA}")"
            echo "$image runs as: '${user:-<root>}'"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::devforge-ai/$image runs as root"
              exit 1
            fi
          done

      # Blocking: a new high or critical advisory with a released fix fails the build. Accepted
      # exceptions live in .trivyignore, each with its reason.
      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devforge-ai/auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          trivyignores: .trivyignore
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Every other image, with the trivy binary the step above installed. The services share a
      # base and most libraries, but not all: git-service carries JGit, and the frontend is nginx
      # on its own Alpine base.
      - name: Scan the remaining images
        run: |
          set -euo pipefail
          command -v trivy > /dev/null || { echo "::error::trivy not on PATH"; exit 1; }
          failed=0
          for name in api-gateway project-service task-service git-service review-service \
                      documentation-service chat-service analytics-service notification-service frontend; do
            echo "::group::$name"
            if ! trivy image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
                --ignorefile .trivyignore "devforge-ai/$name:${GITHUB_SHA}"; then
              echo "::error::$name has high or critical advisories"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Filesystem scan of the npm lockfile and the Maven dependency tree, plus hard-coded
      # secrets. Blocking: every POM and the lockfile scanned clean. Accepted exceptions live in
      # .trivyignore with their reasons.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          exit-code: '1'
          trivyignores: .trivyignore
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  compose:
    name: Full stack (docker compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Docker Hub through Google's mirror, for the same rate-limit reason as the image build.
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # The production topology: every service in its own container, each with its own PostgreSQL
      # database, a real Kafka broker and Redis, and the browser talking to nginx, which proxies
      # /api to the gateway. Nothing else in CI exercises real PostgreSQL (FOR UPDATE SKIP LOCKED,
      # the migrations) or a real broker between separate services.
      #
      # The auth rate limit is raised because every browser test signs in, and through nginx they
      # all arrive from one address.
      - name: Start the stack
        env:
          DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE: "1000"
          DEVFORGE_REQUIRE_EMAIL_VERIFICATION: "false"
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite against the stack
        working-directory: frontend
        # Switches on the assertions that need a real broker, e.g. the audit log filling.
        env:
          E2E_FULL_STACK: "1"
        run: npm run test:e2e

      # The browser suite cannot see Kafka, so check the event pipeline directly: every outbox the
      # suite wrote to has drained to the broker - which on PostgreSQL goes through the
      # FOR UPDATE SKIP LOCKED claim, never exercised anywhere else - and the consumers in other
      # services have processed what arrived.
      - name: Verify events crossed Kafka between services
        run: |
          set -euo pipefail
          q() { docker compose exec -T postgres psql -U devforge -d "$1" -tAc "$2"; }
          has() { [ "$(q "$1" "select to_regclass('public.$2') is not null")" = "t" ]; }
          for _ in $(seq 1 30); do
            pending=0
            for db in auth project task git review documentation chat analytics notification; do
              if has "devforge_$db" outbox_events; then
                n="$(q "devforge_$db" "select count(*) from outbox_events where published_at is null")"
                pending=$((pending + n))
              fi
            done
            [ "$pending" = 0 ] && break
            sleep 2
          done
          total=0
          for db in auth project task git review documentation chat analytics notification; do
            if has "devforge_$db" outbox_events; then
              all="$(q "devforge_$db" "select count(*) from outbox_events")"
              left="$(q "devforge_$db" "select count(*) from outbox_events where published_at is null")"
              echo "$db: $all events written, $left unpublished"
              total=$((total + all))
              [ "$left" = 0 ] || { echo "::error::$db outbox did not drain"; exit 1; }
            fi
          done
          [ "$total" -gt 0 ] || { echo "::error::no service wrote any event"; exit 1; }
          for db in notification analytics; do
            n="$(q "devforge_$db" "select count(*) from processed_events")"
            echo "$db consumed: $n"
            [ "$n" -gt 0 ] || { echo "::error::$db consumed nothing"; exit 1; }
          done

      # The hardening in docker-compose.yml, checked on the running containers rather than read off
      # the file: a read-only root, no capabilities, and a write outside /tmp actually refused.
      - name: Containers run read-only and unprivileged
        run: |
          set -euo pipefail
          for service in frontend api-gateway auth-service project-service task-service git-service \
              review-service documentation-service chat-service analytics-service notification-service; do
            id="$(docker compose ps -q "$service")"
            config="$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' "$id")"
            [ "$config" = "true [ALL]" ] || { echo "::error::$service runs with: $config"; exit 1; }
            if docker compose exec -T "$service" sh -c 'echo x > /written-at-runtime' 2> /dev/null; then
              echo "::error::$service could write to its root filesystem"; exit 1
            fi
          done
          echo "all eleven containers are read-only and hold no capabilities"

      # Two publishers on one outbox. Production scales a service by running more of it, and only the
      # FOR UPDATE SKIP LOCKED claim keeps two instances from publishing the same row twice - which
      # consumers would mostly hide by deduplicating, so the topic itself is read to check.
      - name: Two instances of a service publish each event once
        run: |
          set -euo pipefail
          q() { docker compose exec -T postgres psql -U devforge -d "$1" -tAc "$2"; }
          docker compose run -d --no-deps --name task-service-2 \
            -e LOGGING_LEVEL_COM_DEVFORGE_AI_COMMON_EVENTS_OUTBOX=DEBUG task-service > /dev/null
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' task-service-2)" = healthy ] && break
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' task-service-2)" = healthy ] \
            || { docker logs --tail 80 task-service-2; echo "::error::the second instance did not start"; exit 1; }

          api=http://localhost:4173/api/v1
          user="burst$RANDOM$RANDOM"
          curl -sf -X POST "$api/auth/signup" -H 'Content-Type: application/json' \
            -d "{\"firstName\":\"Burst\",\"lastName\":\"Check\",\"username\":\"$user\",\"email\":\"$user@example.com\",\"password\":\"Str0ng!Passw0rd#\",\"organization\":\"Burst\"}" > /dev/null
          token="$(curl -sf -X POST "$api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"usernameOrEmail\":\"$user\",\"password\":\"Str0ng!Passw0rd#\"}" | jq -r .data.accessToken)"
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::login returned no access token"; exit 1; }
          auth="Authorization: Bearer $token"
          org="$(curl -sf -X POST "$api/organizations" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"name\":\"Burst\",\"slug\":\"burst-$user\"}" | jq -r .data.id)"
          project="$(curl -sf -X POST "$api/organizations/$org/projects" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Burst","projectKey":"BRST"}' | jq -r .data.id)"
          seq 1 200 | xargs -P 8 -I{} curl -sf -o /dev/null -X POST "$api/organizations/$org/projects/$project/tasks" \
            -H "$auth" -H 'Content-Type: application/json' -d '{"title":"contention {}"}'

          for _ in $(seq 1 60); do
            [ "$(q devforge_task "select count(*) from outbox_events where published_at is null")" = 0 ] && break
            sleep 2
          done
          written="$(q devforge_task "select count(*) from outbox_events where payload like '%$project%'")"

          docker compose exec -T kafka sh -c "
            printf '%s\n' security.protocol=SASL_SSL sasl.mechanism=PLAIN \
              ssl.truststore.type=PEM ssl.truststore.location=/certs/ca.pem \
              'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"admin-dev-only\";' \
              > /tmp/read.properties
            kafka-console-consumer --bootstrap-server kafka:29092 --topic devforge.tasks.v1 --from-beginning \
              --timeout-ms 20000 --consumer.config /tmp/read.properties" 2> /dev/null \
            | grep "$project" | grep -o '"eventId":"[^"]*"' | sort > /tmp/event-ids || true
          published="$(wc -l < /tmp/event-ids)"
          duplicates="$(uniq -d /tmp/event-ids | wc -l)"
          by_second="$(docker logs task-service-2 2>&1 | grep -o 'Published [0-9]* outbox' | awk '{n += $2} END {print n + 0}')"
          echo "events written: $written, on the topic: $published, duplicated: $duplicates, published by the second instance: $by_second"
          docker rm -f task-service-2 > /dev/null

          [ "$written" -ge 200 ] || { echo "::error::only $written task events were written"; exit 1; }
          [ "$published" = "$written" ] || { echo "::error::$written events written, $published on the topic"; exit 1; }
          [ "$duplicates" = 0 ] || { echo "::error::$duplicates events were published more than once"; exit 1; }
          # Both instances must have taken part, or there was no contention to survive.
          [ "$by_second" -gt 0 ] && [ "$by_second" -lt "$written" ] \
            || { echo "::error::the second instance published $by_second of $written: no contention happened"; exit 1; }

      # The ACLs must refuse, not only allow: the event check above proves the grants are enough,
      # this proves they are not too much. chat-service has an identity and no grants, so writing
      # auth-service's identity topic must be refused; and a wrong password must not authenticate.
      - name: Verify Kafka refuses what the ACLs do not grant
        run: |
          set -uo pipefail
          # $3 is the protocol: SASL_SSL trusting the stack's CA, as the services connect.
          attempt() {
            docker compose exec -T kafka sh -c "
              printf '%s\n' security.protocol=${3:-SASL_SSL} sasl.mechanism=PLAIN \
                ssl.truststore.type=PEM ssl.truststore.location=/certs/ca.pem \
                'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$1\" password=\"$2\";' \
                max.block.ms=10000 > /tmp/attempt.properties
              echo forged | kafka-console-producer --bootstrap-server kafka:29092 \
                --topic devforge.identity.v1 --producer.config /tmp/attempt.properties" 2>&1
          }
          # The right credentials without TLS: the listener speaks only TLS, so this never authenticates.
          out="$(attempt auth-service auth-dev-only SASL_PLAINTEXT)"
          echo "$out" | tail -2
          echo "$out" | grep -q "TimeoutException\|not present in metadata\|disconnected" \
            || { echo "::error::a client without TLS was not refused"; exit 1; }
          # Over TLS, chat-service authenticates and is then refused by the ACLs: reaching an
          # authorization error at all proves the handshake and the credentials both worked.
          out="$(attempt chat-service chat-dev-only)"
          echo "$out" | tail -3
          echo "$out" | grep -q "TopicAuthorizationException\|Not authorized" \
            || { echo "::error::chat-service was not refused write access to the identity topic"; exit 1; }
          out="$(attempt auth-service wrong-password)"
          echo "$out" | tail -3
          echo "$out" | grep -q "SaslAuthenticationException\|Authentication failed" \
            || { echo "::error::a wrong password was not refused"; exit 1; }
          echo "refused as expected"

      # The monitoring stack, checked rather than assumed: every service scraped and up, a real
      # query answered, and Grafana provisioned with the data source and the dashboard.
      - name: Verify Prometheus scrapes every service and Grafana is provisioned
        run: |
          set -euo pipefail
          docker compose --profile observability up -d prometheus alertmanager grafana
          up=0
          # Tolerant while Prometheus starts: an early request can be reset (curl exit 56), and under
          # "set -e" that ended the step before Prometheus had scraped anything.
          for _ in $(seq 1 30); do
            up="$( (curl -s http://localhost:9090/api/v1/targets || true) \
              | jq '[.data.activeTargets[]? | select(.labels.job=="devforge-services" and .health=="up")] | length' 2>/dev/null || echo 0)"
            [ "$up" = 10 ] && break
            sleep 4
          done
          curl -s http://localhost:9090/api/v1/targets \
            | jq -r '.data.activeTargets[] | "\(.labels.service) \(.health) \(.lastError)"'
          [ "$up" = 10 ] || { echo "::error::only $up of 10 services are being scraped"; exit 1; }

          series="$(curl -s --get http://localhost:9090/api/v1/query \
            --data-urlencode 'query=sum by (service) (jvm_memory_used_bytes{area="heap"})' \
            | jq '.data.result | length')"
          echo "services reporting heap: $series"
          [ "$series" = 10 ] || { echo "::error::heap metrics from $series services, not 10"; exit 1; }

          # The alert rules loaded and evaluate, and the event-pipeline meters they watch exist in
          # every service that publishes - auth, project, task, git, review, documentation; the three that
          # only consume switch their outbox off. A rule over a metric nobody exports never fires.
          # A rule reports "unknown" until its group first evaluates, so wait for that.
          for _ in $(seq 1 30); do
            rules="$( (curl -s http://localhost:9090/api/v1/rules || true) \
              | jq '[.data.groups[]?.rules[]? | select(.health=="ok")] | length' 2>/dev/null || echo 0)"
            [ "$rules" = 6 ] && break
            sleep 3
          done
          curl -s http://localhost:9090/api/v1/rules \
            | jq -r '.data.groups[].rules[] | "\(.name) \(.health) \(.lastError // "")"'
          echo "alert rules healthy: $rules"
          [ "$rules" = 6 ] || { echo "::error::$rules of 6 alert rules are loaded and healthy"; exit 1; }
          outboxes="$(curl -s --get http://localhost:9090/api/v1/query \
            --data-urlencode 'query=devforge_outbox_pending' | jq '.data.result | length')"
          echo "services reporting their outbox: $outboxes"
          [ "$outboxes" = 6 ] || { echo "::error::outbox metrics from $outboxes services, not 6"; exit 1; }

          for _ in $(seq 1 30); do
            curl -sf -u admin:admin http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf -u admin:admin "http://localhost:3000/api/datasources/uid/devforge-prometheus/health" \
            | jq -e '.status == "OK"'
          curl -sf -u admin:admin "http://localhost:3000/api/dashboards/uid/devforge-services" \
            | jq -e '.dashboard.title == "DevForge services"'

      # An alert reaching a person, not just firing: stop a service and wait for ServiceDown to be
      # emailed through Alertmanager to Mailpit. Last, because it takes a service away.
      - name: An alert is delivered when a service goes down
        run: |
          set -euo pipefail
          curl -s http://localhost:9090/api/v1/alertmanagers \
            | jq -e '.data.activeAlertmanagers | length == 1' > /dev/null \
            || { echo "::error::Prometheus has no Alertmanager"; exit 1; }
          docker compose stop chat-service
          # ServiceDown waits 2 minutes before firing, then Alertmanager groups for 10s.
          delivered=""
          for _ in $(seq 1 60); do
            delivered="$( (curl -s "http://localhost:8025/api/v1/search?query=subject:ServiceDown" || true) \
              | jq -r '[.messages[]? | select(.Subject | contains("chat-service"))] | length' 2>/dev/null || echo 0)"
            [ "${delivered:-0}" -ge 1 ] && break
            sleep 5
          done
          curl -s "http://localhost:8025/api/v1/search?query=subject:ServiceDown" | jq -r '.messages[]?.Subject'
          [ "${delivered:-0}" -ge 1 ] || { echo "::error::no ServiceDown email for chat-service"; exit 1; }
          docker compose start chat-service

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color > compose.log 2>&1; tail -n 400 compose.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

  kubernetes:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Docker Hub through Google's mirror, as in the compose job.
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # The manifests deploy what the compose stack runs, from infrastructure/kubernetes, applied
      # to a real cluster: they were never applied anywhere before this job.
      - name: Build the images
        run: |
          set -euo pipefail
          for entry in api-gateway:api-gateway:8080 auth-service:services/auth-service:9001 \
              project-service:services/project-service:9002 task-service:services/task-service:9003 \
              git-service:services/git-service:9005 review-service:services/review-service:9006 \
              documentation-service:services/documentation-service:9007 \
              chat-service:services/chat-service:9008 analytics-service:services/analytics-service:9010 \
              notification-service:services/notification-service:9011; do
            name="${entry%%:*}"; rest="${entry#*:}"; path="${rest%%:*}"; port="${rest##*:}"
            docker build -q --target service --build-arg "MODULE_PATH=$path" \
              --build-arg "ARTIFACT_ID=$name" --build-arg "SERVICE_PORT=$port" -t "devforge-ai/$name:latest" .
          done
          docker build -q -f frontend/Dockerfile -t devforge-ai/frontend:latest frontend

      - name: Create the cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: devforge

      # Every image goes in from the host, so nothing inside the cluster pulls from Docker Hub.
      - name: Load the images into the cluster
        run: |
          set -euo pipefail
          third_party="postgres:15 redis:7 confluentinc/cp-kafka:7.7.1 ghcr.io/axllent/mailpit:v1.31.4 \
            quay.io/prometheus/prometheus:v3.15.0 quay.io/prometheus/alertmanager:v0.34.1 grafana/grafana:13.2.3"
          # Retried: one registry timeout (ghcr.io, once) failed the whole job before anything deployed.
          for image in $third_party; do
            for attempt in 1 2 3; do
              docker pull -q "$image" && break
              [ "$attempt" = 3 ] && { echo "::error::could not pull $image"; exit 1; }
              sleep $((attempt * 10))
            done
          done
          kind load docker-image --name devforge $third_party \
            $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^devforge-ai/.*:latest$')

      - name: Check the generated manifests are current
        run: |
          node infrastructure/kubernetes/generate.cjs
          git diff --exit-code -- infrastructure/kubernetes \
            || { echo "::error::run node infrastructure/kubernetes/generate.cjs and commit"; exit 1; }

      - name: Deploy
        run: |
          set -euo pipefail
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          sh infrastructure/kubernetes/create-secrets.sh
          kubectl apply -f infrastructure/kubernetes/configmap.yaml
          # A test cluster: served over plain HTTP on localhost, and signing straight in.
          kubectl -n devforge-ai patch configmap devforge-ai-config --type merge -p \
            '{"data":{"DEVFORGE_APP_BASE_URL":"http://localhost:8081","DEVFORGE_COOKIE_SECURE":"false","DEVFORGE_REQUIRE_EMAIL_VERIFICATION":"false","DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE":"1000"}}'
          kubectl apply -f infrastructure/kubernetes/infrastructure.yaml
          kubectl apply -f infrastructure/kubernetes/services.yaml
          kubectl apply -f infrastructure/kubernetes/monitoring.yaml

      - name: Wait for everything to be ready
        run: |
          set -euo pipefail
          kubectl -n devforge-ai wait --for=condition=complete job/kafka-setup --timeout=10m
          for d in $(kubectl -n devforge-ai get deployments -o name); do
            kubectl -n devforge-ai rollout status "$d" --timeout=15m
          done
          kubectl -n devforge-ai get pods

      - name: Smoke test through nginx and the gateway
        run: |
          set -euo pipefail
          kubectl -n devforge-ai port-forward svc/frontend 8081:80 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8081/ && break; sleep 2; done
          api=http://localhost:8081/api/v1
          user="kind$RANDOM$RANDOM"
          curl -sf -X POST "$api/auth/signup" -H 'Content-Type: application/json' \
            -d "{\"firstName\":\"Kind\",\"lastName\":\"Check\",\"username\":\"$user\",\"email\":\"$user@example.com\",\"password\":\"Str0ng!Passw0rd#\",\"organization\":\"Kind Org\"}" > /dev/null
          token="$(curl -sf -X POST "$api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"usernameOrEmail\":\"$user\",\"password\":\"Str0ng!Passw0rd#\"}" | jq -r .data.accessToken)"
          auth="Authorization: Bearer $token"
          org="$(curl -sf -X POST "$api/organizations" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"name\":\"Kind Org\",\"slug\":\"kind-$user\"}" | jq -r .data.id)"
          project="$(curl -sf -X POST "$api/organizations/$org/projects" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Kind Project","projectKey":"KIND"}' | jq -r .data.id)"
          curl -sf -X POST "$api/organizations/$org/projects/$project/tasks" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"title":"Runs on Kubernetes"}' > /dev/null
          curl -sf "$api/organizations/$org/projects/$project/tasks/board" -H "$auth" \
            | jq -e '[.data[].tasks[]] | length == 1'
          echo "signup, login, organization, project and task work through the cluster"

          # The events left their services and reached the audit log, over the in-cluster Kafka.
          psql() { kubectl -n devforge-ai exec statefulset/postgres -- psql -U devforge -d "$1" -tAc "$2"; }
          # Up to three minutes: a consumer that joined before the topics existed picks them up on
          # its next metadata refresh (30s), and the events wait in the topic until it does.
          for _ in $(seq 1 90); do
            entries="$(psql devforge_analytics "select count(*) from audit_log where project_id = '$project'")"
            [ "$entries" -ge 2 ] && break
            sleep 2
          done
          echo "audit entries for the project: $entries"
          [ "$entries" -ge 2 ] || { echo "::error::events did not reach the audit log"; exit 1; }

          # The chain re-hashes on real PostgreSQL. H2 cannot show that a timestamp comes back from
          # the database exactly as it was hashed, and if it did not, every entry would read as
          # tampered with.
          verification="$(curl -sf "$api/organizations/$org/projects/$project/analytics/audit/verification" -H "$auth")"
          echo "audit verification: $(echo "$verification" | jq -c .data)"
          echo "$verification" | jq -e '.data.intact and .data.entries >= 2' > /dev/null \
            || { echo "::error::the audit chain did not verify"; exit 1; }

          # Git over HTTP with the real git client, through nginx, the gateway and git-service, with
          # the personal token exchanged at auth-service and access decided by project-service.
          repo="$(curl -sf -X POST "$api/organizations/$org/projects/$project/repositories" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"over-git"}' | jq -r .data.id)"
          pat="$(curl -sf -X POST "$api/auth/tokens" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"ci","expiresInDays":1}' | jq -r .data.token)"
          remote="http://ci:$pat@localhost:8081/api/v1/git/$org/$project/$repo.git"
          work="$(mktemp -d)"
          git -C "$work" init -q -b main
          echo "pushed over http" > "$work/README.md"
          git -C "$work" add README.md
          git -C "$work" -c user.name=CI -c user.email=ci@example.com commit -q -m "First push"
          git -C "$work" push -q "$remote" main
          curl -sf "$api/organizations/$org/projects/$project/repositories/$repo/blob?ref=main&path=README.md" \
            -H "$auth" | jq -e '.data.content == "pushed over http\n"' > /dev/null \
            || { echo "::error::the pushed file is not on main"; exit 1; }
          git clone -q "$remote" "$work/clone"
          grep -q "pushed over http" "$work/clone/README.md"
          anonymous="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8081/api/v1/git/$org/$project/$repo.git/info/refs?service=git-upload-pack")"
          [ "$anonymous" = 401 ] || { echo "::error::anonymous git access answered $anonymous"; exit 1; }
          # The exchange turns a git-only token into a full access token, so it must stay internal,
          # including against path tricks that some proxy might fail to normalise.
          for path in /internal/v1/tokens/exchange /api/v1/auth/../../internal/v1/tokens/exchange \
              /api/v1/auth/%2e%2e/%2e%2e/internal/v1/tokens/exchange; do
            body="$(curl -s --path-as-is -X POST "http://localhost:8081$path" \
              -H 'Content-Type: application/json' -d "{\"token\":\"$pat\"}" || true)"
            if echo "$body" | grep -q accessToken; then
              echo "::error::the token exchange answered from outside at $path"; exit 1
            fi
          done
          echo "git push and clone over HTTP work through the cluster"

      - name: Prometheus scrapes every service in the cluster
        run: |
          set -euo pipefail
          kubectl -n devforge-ai port-forward svc/prometheus 9090:9090 > /dev/null 2>&1 &
          up=0
          for _ in $(seq 1 40); do
            up="$( (curl -s http://localhost:9090/api/v1/targets || true) \
              | jq '[.data.activeTargets[]? | select(.health=="up")] | length' 2>/dev/null || echo 0)"
            [ "$up" = 10 ] && break
            sleep 4
          done
          echo "targets up: $up"
          [ "$up" = 10 ] || { echo "::error::only $up of 10 services scraped"; exit 1; }
          curl -s http://localhost:9090/api/v1/alertmanagers \
            | jq -e '.data.activeAlertmanagers | length == 1' > /dev/null \
            || { echo "::error::Prometheus in the cluster has no Alertmanager"; exit 1; }
          echo "Prometheus is sending alerts to Alertmanager"

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n devforge-ai get pods -o wide || true
          kubectl -n devforge-ai get events --sort-by=.lastTimestamp | tail -60 || true
          for p in $(kubectl -n devforge-ai get pods -o name); do
            echo "::group::$p"; kubectl -n devforge-ai logs "$p" --tail=80 --all-containers || true; echo "::endgroup::"
          done
