name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded runs on the same ref to keep queue times sane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci requires the lockfile to be committed and in sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Blocks on high or critical advisories in what ships to the browser. Dev tooling is left out
      # here: its findings (vite, vitest, tailwind, typescript-eslint) all need major upgrades and are
      # tracked in docs/SECURITY.md, and none of it reaches a user.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # "npm test" is vitest in run (non-watch) mode, so it terminates in CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # "verify" runs unit tests (surefire) and integration tests (failsafe).
      # Tests are deliberately NOT skipped here: a green pipeline that skipped
      # the tests tells us nothing.
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build service jars
        run: >
          mvn -B -ntp -f backend/pom.xml
          -pl ../services/auth-service,../services/project-service
          -am package -DskipTests

      # The standalone profile runs the real application code against an
      # embedded database, so this job needs no Postgres, Kafka, Redis or SMTP
      # service container.
      - name: Start backend services
        run: |
          java -jar services/auth-service/target/auth-service-0.1.0.jar \
            --spring.profiles.active=standalone > auth.log 2>&1 &
          java -jar services/project-service/target/project-service-0.1.0.jar \
            --spring.profiles.active=standalone > project.log 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the dev server
        working-directory: frontend
        run: npm run dev > vite.log 2>&1 &

      # Poll rather than sleep: JVM startup time varies a lot on shared runners.
      - name: Wait for the stack
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1"
            for _ in $(seq 1 60); do
              if curl -sS -o /dev/null "$url"; then
                echo "ready: $url"
                return 0
              fi
              sleep 2
            done
            echo "::error::timed out waiting for $url"
            return 1
          }
          wait_for http://localhost:9001/actuator/health
          wait_for http://localhost:9002/actuator/health
          wait_for http://localhost:4173/

      # Browser-level tests. The unit suite cannot replace these: it once
      # rendered App inside a provider tree the real entry point did not have,
      # so it stayed green while every screen after sign-in threw on mount.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            auth.log
            project.log
            frontend/vite.log
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # All JVM services share one root Dockerfile and one Maven build. The
      # context is the repository root because the reactor parent and
      # common-library live outside each service directory. The `build` stage is
      # produced once and reused from cache by every subsequent service image.
      - name: Warm the shared build stage
        run: docker build --target build -t devforge-ai/build-cache .

      - name: Build backend images
        run: |
          set -euo pipefail
          # name : module path : port
          modules=(
            "api-gateway:api-gateway:8080"
            "config-server:config-server:8888"
            "discovery-server:discovery-server:8761"
            "auth-service:services/auth-service:9001"
            "project-service:services/project-service:9002"
            "task-service:services/task-service:9003"
            "ai-service:services/ai-service:9004"
            "git-service:services/git-service:9005"
            "review-service:services/review-service:9006"
            "documentation-service:services/documentation-service:9007"
            "chat-service:services/chat-service:9008"
            "deployment-service:services/deployment-service:9009"
            "analytics-service:services/analytics-service:9010"
            "notification-service:services/notification-service:9011"
          )
          for entry in "${modules[@]}"; do
            name="${entry%%:*}"
            rest="${entry#*:}"
            path="${rest%%:*}"
            port="${rest##*:}"
            echo "::group::Building $name"
            docker build --target service \
              --build-arg "MODULE_PATH=$path" \
              --build-arg "ARTIFACT_ID=$name" \
              --build-arg "SERVICE_PORT=$port" \
              -t "devforge-ai/$name:${GITHUB_SHA}" .
            echo "::endgroup::"
          done

      # The frontend image is self-contained, so its context is frontend/.
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "devforge-ai/frontend:${GITHUB_SHA}" frontend

      # Fails the job if any image would run as root. The previous images all
      # did; this keeps that from silently regressing.
      - name: Verify images do not run as root
        run: |
          set -euo pipefail
          for image in auth-service api-gateway frontend; do
            user="$(docker image inspect -f '{{.Config.User}}' "devforge-ai/$image:${GITHUB_SHA}")"
            echo "$image runs as: '${user:-<root>}'"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::devforge-ai/$image runs as root"
              exit 1
            fi
          done

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devforge-ai/auth-service:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Filesystem scan covers both the npm lockfile and the Maven dependency tree,
      # plus hard-coded secrets. exit-code is 0 for now so the scan reports without
      # blocking; tighten to 1 once the current findings are triaged.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
