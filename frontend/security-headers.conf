# Security headers for every response the SPA's nginx serves.
#
# Included in every location that serves the app (not /api/, which carries the gateway's own),
# rather than once at server level, because nginx drops inherited add_header directives in any block
# that declares one. The previous config set
# these only at server level, so by that rule index.html and the assets - the responses a browser
# enforces a CSP on - went out with none of them. CI now starts the image and checks.
#
# $request_id is nginx's per-request random id, used as the CSP style nonce: CodeMirror injects
# <style> elements, and a nonce admits ours without allowing inline styles in general. nginx.conf
# writes the same value into index.html for the app to read.
#
# vite.config.ts reads this file for `vite preview`, so the browser suite runs the production build
# under exactly this policy. Keep one add_header per line, value in double quotes.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
