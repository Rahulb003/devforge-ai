# Security headers for every response the SPA's nginx serves.
#
# Included in the server block AND in every location that sets its own add_header, because nginx
# drops inherited add_header directives in any block that declares one. The previous config set
# these only at server level, so by that rule index.html and the assets - the responses a browser
# enforces a CSP on - went out with none of them. CI now starts the image and checks.
#
# vite.config.ts reads this file for `vite preview`, so the browser suite runs the production build
# under exactly this policy. Keep one add_header per line, value in double quotes.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
