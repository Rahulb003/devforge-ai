# nginx config for the DevForge AI single-page app.
# Port 8080 because the image runs unprivileged and cannot bind 80.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # The security headers are included per location, not here: see security-headers.conf. They are
    # deliberately absent from /api/, whose responses carry the gateway's own stricter headers;
    # adding these as well would send two conflicting CSPs and a repeated X-Frame-Options.

    gzip on;

    # The API, on this same origin, so the HttpOnly session cookies (path /api) are sent and the
    # CSP's connect-src 'self' covers it. ${API_GATEWAY_UPSTREAM} is filled in at container start
    # by the image's envsubst step. Buffering is off so chat's server-sent events arrive as they are
    # written, and the read timeout outlasts the stream's own lifetime.
    location /api/ {
        proxy_pass ${API_GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so built assets are immutable and
    # can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to a stale
    # bundle after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        # The same per-request value as the CSP header's style nonce; index.html is never cached,
        # so each page load gets its own.
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once on;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # SPA fallback: let React Router handle any unmatched path.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
