# nginx config for the DevForge AI single-page app.
# Port 8080 because the image runs unprivileged and cannot bind 80.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # See security-headers.conf for why this is included in every block that sets headers.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so built assets are immutable and
    # can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to a stale
    # bundle after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # SPA fallback: let React Router handle any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
