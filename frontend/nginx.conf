# nginx config for the DevForge AI single-page app.
# Port 8080 because the image runs unprivileged and cannot bind 80.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. CSP is deliberately conservative; 'unsafe-inline' for
    # styles is required by the Tailwind runtime style injection, and should be
    # replaced with a nonce once the app stops injecting styles at runtime.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so built assets are immutable and
    # can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to a stale
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # SPA fallback: let React Router handle any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
