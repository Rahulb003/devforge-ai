apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: devforge-ai
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: config-server
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: devforge-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: devforge-ai/config-server:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: devforge-ai-config
            - secretRef:
                name: devforge-ai-kafka
---
