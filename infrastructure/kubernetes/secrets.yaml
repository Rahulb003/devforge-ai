# ---------------------------------------------------------------------------
# TEMPLATE ONLY — DO NOT PUT REAL SECRET VALUES IN THIS FILE.
#
# Lists the keys the manifests read. Every value is a placeholder: the services refuse to start
# on some of them (a JWT key under 32 bytes), and the rest would deploy guessable credentials, so
# this file is never applied as-is.
#
# Supply real values by one of:
#
#   1. External Secrets Operator (preferred) - sync from a secret manager.
#   2. Sealed Secrets - commit an encrypted SealedSecret only the cluster can decrypt.
#   3. For a throwaway cluster: infrastructure/kubernetes/create-secrets.sh, which generates a
#      random value for every key. CI uses it.
#
# Kubernetes Secret values are base64-encoded, not encrypted: anyone who can read the Secret, or
# the repository if a real one were committed, has them.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: devforge-ai-secrets
  namespace: devforge-ai
  annotations:
    devforge.ai/template: "true"
type: Opaque
stringData:
  postgres-username: REPLACE_ME
  postgres-password: REPLACE_ME
  # At least 32 bytes; auth-service refuses to start otherwise. openssl rand -base64 48
  jwt-signing-key: REPLACE_ME
  # Prometheus's scrape credential for /actuator/prometheus.
  metrics-token: REPLACE_ME
  # Kafka: the broker's admin, and one identity per service (their grants are in
  # infrastructure/docker/kafka/setup.sh).
  kafka-admin-password: REPLACE_ME
  kafka-password-auth-service: REPLACE_ME
  kafka-password-project-service: REPLACE_ME
  kafka-password-task-service: REPLACE_ME
  kafka-password-git-service: REPLACE_ME
  kafka-password-review-service: REPLACE_ME
  kafka-password-documentation-service: REPLACE_ME
  kafka-password-chat-service: REPLACE_ME
  kafka-password-analytics-service: REPLACE_ME
  kafka-password-notification-service: REPLACE_ME
  grafana-admin-password: REPLACE_ME
  # Empty when the SMTP relay needs no login.
  # Empty turns AI assistance off; it then says so rather than pretending.
  anthropic-api-key: ""
  mail-username: ""
  mail-password: ""
---
# Kafka's TLS. ca.pem is the CA that signed the broker's certificate (every Kafka client trusts
# it); broker.p12 is the broker's key and certificate chain for the names kafka,
# kafka.devforge-ai.svc and kafka.devforge-ai.svc.cluster.local. Issue them with cert-manager or
# your PKI; create-secrets.sh makes a throwaway pair for a test cluster.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-tls
  namespace: devforge-ai
type: Opaque
stringData:
  ca.pem: REPLACE_ME
  store-password: REPLACE_ME
# broker.p12 is binary: add it with
#   kubectl create secret generic kafka-tls --from-file=broker.p12 --from-file=ca.pem ...
