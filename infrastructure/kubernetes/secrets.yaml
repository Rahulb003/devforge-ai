# ---------------------------------------------------------------------------
# TEMPLATE ONLY — DO NOT PUT REAL SECRET VALUES IN THIS FILE.
#
# This file is committed to version control. Kubernetes Secret `data:` values
# are base64-ENCODED, not encrypted: anyone with repository access can decode
# them with `base64 -d`. This template previously carried working credentials
# that way.
#
# Supply real values by one of:
#
#   1. External Secrets Operator (preferred) — sync from AWS Secrets Manager,
#      GCP Secret Manager, Azure Key Vault or Vault:
#        https://external-secrets.io
#
#   2. Sealed Secrets — commit an encrypted SealedSecret that only the
#      in-cluster controller can decrypt:
#        kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
#   3. Out-of-band for a throwaway cluster, never committed:
#        kubectl create secret generic devforge-ai-secrets \
#          --namespace devforge-ai \
#          --from-literal=postgres-username="$POSTGRES_USER" \
#          --from-literal=postgres-password="$POSTGRES_PASSWORD" \
#          --from-literal=postgres-db="$POSTGRES_DB" \
#          --from-literal=jwt-signing-key="$(openssl rand -base64 48)" \
#          --from-literal=grafana-admin-password="$GRAFANA_ADMIN_PASSWORD" \
#          --from-literal=mail-username="$MAIL_USERNAME" \
#          --from-literal=mail-password="$MAIL_PASSWORD"
#
# Applying this file as-is is intended to fail loudly rather than deploy
# guessable credentials.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: devforge-ai-secrets
  namespace: devforge-ai
  annotations:
    devforge.ai/template: "true"
    devforge.ai/warning: "Placeholder values. Replace via External Secrets or Sealed Secrets before applying."
type: Opaque
# stringData takes plain text, so placeholders stay obviously unset instead of
# hiding behind base64 and looking like legitimate values.
stringData:
  postgres-username: REPLACE_ME
  postgres-password: REPLACE_ME
  postgres-db: REPLACE_ME
  # Must be at least 32 bytes; the auth service refuses to start otherwise.
  # Generate with: openssl rand -base64 48
  jwt-signing-key: REPLACE_ME
  grafana-admin-password: REPLACE_ME
  mail-username: REPLACE_ME
  mail-password: REPLACE_ME
  # Leave blank to disable OAuth login entirely.
  google-client-id: ""
  google-client-secret: ""
  microsoft-client-id: ""
  microsoft-client-secret: ""
---
# Kafka client credentials, as environment variables (envFrom). One identity shared by every
# service for now; per-service identities are what topic ACLs need, and are not done yet.
#   kubectl create secret generic devforge-ai-kafka --namespace devforge-ai \
#     --from-literal=DEVFORGE_KAFKA_SASL_USERNAME=devforge-services \
#     --from-literal=DEVFORGE_KAFKA_SASL_PASSWORD="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: devforge-ai-kafka
  namespace: devforge-ai
  annotations:
    devforge.ai/template: "true"
type: Opaque
stringData:
  DEVFORGE_KAFKA_SASL_USERNAME: REPLACE_ME
  DEVFORGE_KAFKA_SASL_PASSWORD: REPLACE_ME
