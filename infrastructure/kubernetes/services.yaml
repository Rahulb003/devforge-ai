apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devforge-ai
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devforge-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: devforge-ai/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # nginx proxies /api here, so the browser stays on one origin for the session cookies.
            - name: API_GATEWAY_UPSTREAM
              value: "http://api-gateway:8080"
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
          # nginx keeps its pid and temp files in /tmp, and the entrypoint renders the config
          # template into conf.d at start; the rest of the filesystem is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: conf
          emptyDir: { sizeLimit: 1Mi }
