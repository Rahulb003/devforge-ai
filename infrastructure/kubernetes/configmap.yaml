# Non-secret settings shared by the services. Credentials are in devforge-ai-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: devforge-ai-config
  namespace: devforge-ai
data:
  # Never "local": that profile carries development fallbacks, including a well-known JWT key.
  SPRING_PROFILES_ACTIVE: prod
  DEVFORGE_JWT_ISSUER: devforge-ai

  # Where the browser reaches the app: the CORS allow-list and the links in emails.
  DEVFORGE_APP_BASE_URL: https://app.devforge.ai
  DEVFORGE_COOKIE_SECURE: "true"
  DEVFORGE_COOKIE_SAME_SITE: Strict
  DEVFORGE_REQUIRE_EMAIL_VERIFICATION: "true"
  DEVFORGE_RATE_LIMIT_AUTH_PER_MINUTE: "30"

  # Kafka clients authenticate as their own service. PLAIN over plain TCP inside the cluster
  # network, matching the broker these manifests deploy; with a TLS-enabled broker, use
  # SASL_SSL and SCRAM-SHA-512 (the client default) instead. TLS is UNVERIFIED.
  DEVFORGE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  # Share of requests traced. 1.0 suits a test cluster; production would sample far less.
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  DEVFORGE_KAFKA_SASL_MECHANISM: PLAIN

  # Mailpit captures mail on a test cluster; point these at a real relay elsewhere.
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_AUTH_ENABLED: "false"
  MAIL_STARTTLS_ENABLED: "false"
