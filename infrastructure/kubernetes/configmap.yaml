apiVersion: v1
kind: ConfigMap
metadata:
  name: devforge-ai-config
  namespace: devforge-ai
data:
  # A cluster deployment must not run the local profile: that profile carries
  # development fallbacks, including a well-known JWT signing key, and relaxes
  # cookie and actuator exposure. It was previously set to "local" here.
  SPRING_PROFILES_ACTIVE: prod

  SPRING_CLOUD_CONFIG_URI: http://config-server.devforge-ai.svc.cluster.local:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server.devforge-ai.svc.cluster.local:8761/eureka/

  # Non-secret connection coordinates. Credentials come from the
  # devforge-ai-secrets Secret, never from this ConfigMap.
  POSTGRES_HOST: postgres.devforge-ai.svc.cluster.local
  POSTGRES_PORT: "5432"
  DEVFORGE_DB_URL: jdbc:postgresql://postgres.devforge-ai.svc.cluster.local:5432/devforge

  REDIS_HOST: redis.devforge-ai.svc.cluster.local
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: kafka.devforge-ai.svc.cluster.local:9092
  # Every Kafka client authenticates; a service missing its credentials refuses to start rather
  # than connecting anonymously. Credentials come from the devforge-ai-kafka Secret.
  DEVFORGE_KAFKA_REQUIRE_AUTHENTICATION: "true"
  DEVFORGE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  DEVFORGE_KAFKA_SASL_MECHANISM: SCRAM-SHA-512

  DEVFORGE_JWT_ISSUER: devforge-ai
  DEVFORGE_JWT_ACCESS_TTL: 15m
  DEVFORGE_JWT_REFRESH_TTL: 14d
  DEVFORGE_COOKIE_NAME: DEVFORGE_REFRESH_TOKEN
  DEVFORGE_COOKIE_SECURE: "true"
  DEVFORGE_COOKIE_SAME_SITE: Strict

  MAIL_HOST: smtp.internal.devforge-ai.svc.cluster.local
  MAIL_PORT: "587"
  MAIL_FROM: no-reply@devforge.ai
  MAIL_AUTH_ENABLED: "true"
  MAIL_STARTTLS_ENABLED: "true"

  DEVFORGE_APP_BASE_URL: https://app.devforge.ai
