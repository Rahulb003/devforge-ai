# GENERATED by infrastructure/kubernetes/generate.cjs - edit the generator, not this file.
# Prometheus and Grafana, provisioned from the compose stack's files
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devforge-ai
data:
  # The compose file with the development password swapped for the token from the Secret.
  prometheus.yml: |
    # Scrapes every service's /actuator/prometheus over the compose network.
    #
    # The endpoint needs its own credential (MetricsEndpointFilter): basic auth as "metrics" with the
    # DEVFORGE_METRICS_TOKEN the services are given. The password here is the compose stack's
    # development default; change both together anywhere that is not a throwaway local stack.
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: devforge-services
        metrics_path: /actuator/prometheus
        basic_auth:
          username: metrics
          password_file: /etc/prometheus-secret/metrics-token
        static_configs:
          - targets:
              - api-gateway:8080
              - auth-service:9001
              - project-service:9002
              - task-service:9003
              - git-service:9005
              - review-service:9006
              - documentation-service:9007
              - chat-service:9008
              - analytics-service:9010
              - notification-service:9011
        relabel_configs:
          # "auth-service:9001" -> service="auth-service", for dashboards.
          - source_labels: [__address__]
            regex: '([^:]+):\d+'
            target_label: service
  alerts.yml: |
    # Alert rules for the DevForge services.
    #
    # Each rule is here because its failure is otherwise silent: requests keep succeeding while events,
    # notifications or the audit log quietly stop. There is no Alertmanager in the stack yet, so these
    # fire in Prometheus (/alerts) and nowhere else - routing them to a pager is a deployment decision.
    groups:
      - name: devforge-services
        rules:
          - alert: ServiceDown
            expr: up{job="devforge-services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} has not answered a scrape for 2 minutes"

          - alert: HighServerErrorRate
            # 5xx as a share of all requests, over services with real traffic only; one failed request
            # out of two on an idle service is not an incident.
            expr: |
              (
                sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                  / sum by (service) (rate(http_server_requests_seconds_count[5m]))
              ) > 0.05
              and sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} is answering more than 5% of requests with a 5xx"

          - alert: HeapNearlyFull
            expr: |
              sum by (service) (jvm_memory_used_bytes{area="heap"})
                / sum by (service) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} has used over 90% of its heap for 15 minutes"

      - name: devforge-events
        rules:
          - alert: OutboxEventsStuck
            # Rows past devforge.outbox.alert-after-attempts. They will not drain without a fix: the
            # broker refuses them, or the service lost its credentials or its ACLs.
            expr: devforge_outbox_stuck > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} has {{ $value }} outbox event(s) that keep failing to publish"

          - alert: OutboxBacklogGrowing
            # A backlog that only grows means the publisher is not keeping up or not running at all.
            expr: devforge_outbox_pending > 100 and deriv(devforge_outbox_pending[10m]) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} has {{ $value }} unpublished outbox events and rising"

          - alert: EventsDeadLettered
            # Every dead-lettered event is a notification, audit entry or analytics row that will never
            # exist unless someone inspects the .dlt topic and replays it.
            expr: increase(devforge_events_dead_lettered_total[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} dead-lettered events from {{ $labels.topic }}"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: devforge-ai
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: devforge-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: scrape-token
              mountPath: /etc/prometheus-secret
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: scrape-token
          secret:
            secretName: devforge-ai-secrets
            items:
              - key: metrics-token
                path: metrics-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: devforge-ai
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: devforge-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: devforge
        folder: DevForge
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
---
