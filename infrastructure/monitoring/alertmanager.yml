# Routes the alerts in alerts.yml to people.
#
# Email through the stack's SMTP server, which is Mailpit in compose and on kind: alerts land in
# its inbox (http://localhost:8025) instead of anyone's real mailbox. A deployment points
# smtp_smarthost and the receiver at real ones, or swaps the receiver for a pager or chat webhook.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@devforge.local
  # Mailpit speaks plain SMTP. A real relay must use TLS; set this back to true with it.
  smtp_require_tls: false

route:
  receiver: operators
  # One message per alert and service, so a service going down is one email, not one per rule.
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: operators
    email_configs:
      - to: operators@devforge.local
        send_resolved: true
