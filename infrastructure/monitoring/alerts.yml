# Alert rules for the DevForge services.
#
# Each rule is here because its failure is otherwise silent: requests keep succeeding while events,
# notifications or the audit log quietly stop. There is no Alertmanager in the stack yet, so these
# fire in Prometheus (/alerts) and nowhere else - routing them to a pager is a deployment decision.
groups:
  - name: devforge-services
    rules:
      - alert: ServiceDown
        expr: up{job="devforge-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has not answered a scrape for 2 minutes"

      - alert: HighServerErrorRate
        # 5xx as a share of all requests, over services with real traffic only; one failed request
        # out of two on an idle service is not an incident.
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              / sum by (service) (rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
          and sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is answering more than 5% of requests with a 5xx"

      - alert: HeapNearlyFull
        expr: |
          sum by (service) (jvm_memory_used_bytes{area="heap"})
            / sum by (service) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has used over 90% of its heap for 15 minutes"

  - name: devforge-events
    rules:
      - alert: OutboxEventsStuck
        # Rows past devforge.outbox.alert-after-attempts. They will not drain without a fix: the
        # broker refuses them, or the service lost its credentials or its ACLs.
        expr: devforge_outbox_stuck > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} outbox event(s) that keep failing to publish"

      - alert: OutboxBacklogGrowing
        # A backlog that only grows means the publisher is not keeping up or not running at all.
        expr: devforge_outbox_pending > 100 and deriv(devforge_outbox_pending[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} unpublished outbox events and rising"

      - alert: EventsDeadLettered
        # Every dead-lettered event is a notification, audit entry or analytics row that will never
        # exist unless someone inspects the .dlt topic and replays it.
        expr: increase(devforge_events_dead_lettered_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} dead-lettered events from {{ $labels.topic }}"
